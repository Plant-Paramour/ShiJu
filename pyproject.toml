[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiju"
version = "0.1.0"
description = "Constrained decoding for classical Chinese poetry"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["shiju"]

[tool.ruff]
line-length = 100
target-version = "py310"
